<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartLibrary prototipi</title>
<style>
:root{--bg:#E4ECE7;--cd:#fff;--ink:#1C2421;--mu:#5B6661;--ln:#DDE3DE;--g:#17493F;--gt:#fff;--a:#E9A23B;--rd:#B3402F;--gl:#EAF3EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--cd:#1A2420;--ink:#E8EEEA;--mu:#9DAAA3;--ln:#2C3A34;--g:#4FA58F;--gt:#0B1411;--rd:#E27A68;--gl:#20302A}}
:root[data-theme="dark"]{--bg:#101815;--cd:#1A2420;--ink:#E8EEEA;--mu:#9DAAA3;--ln:#2C3A34;--g:#4FA58F;--gt:#0B1411;--rd:#E27A68;--gl:#20302A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hd{background:var(--g);color:var(--gt);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hd .b{background:transparent;color:var(--gt);border-color:var(--gt)}.hd .b.on{background:var(--a);color:#1C2421;border-color:var(--a)}
.nv{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--ln)}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px}
.rl{display:flex;flex-wrap:wrap;gap:6px}
.b{min-height:40px;padding:0 14px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.b.on,.bp{background:var(--g);color:var(--gt);border-color:var(--g);font-weight:800}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.g{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in{min-height:40px;border:1px solid var(--ln);border-radius:8px;padding:0 10px;font:inherit;background:var(--bg);color:var(--ink);min-width:0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}
.tg{display:inline-block;padding:1px 10px;border-radius:12px;background:var(--gl);color:var(--g);font-weight:800;font-size:12px}.tg.x{color:var(--rd)}
.m{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}.ok{background:var(--gl);color:var(--g)}.er{background:var(--gl);color:var(--rd)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.st b{display:block;font-size:26px}.st span{color:var(--mu);font-size:13px}
.ph{max-width:390px;margin:0 auto;border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--bg)}
.ph .t{background:var(--g);color:var(--gt);padding:12px 16px;font-weight:800}.ph .bd{padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{background:var(--cd);border-radius:12px;padding:10px 12px;max-width:85%}.me{background:var(--g);color:var(--gt);align-self:flex-end}
.bar{height:8px;border-radius:4px;background:var(--ln);flex:1;position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--g)}
.cr{display:flex;align-items:center;gap:8px;font-size:13px}.cr span{width:100px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.md{background:var(--cd);color:var(--ink);border-radius:12px;padding:20px;max-width:380px;width:100%}.b:disabled{opacity:.45;cursor:not-allowed}.bx{border-left:6px solid var(--cl);background:color-mix(in srgb,var(--cl) 9%,var(--cd))}.bx>b:first-child{color:var(--cl);font-size:16px}label.mu{display:flex;flex-direction:column;gap:4px}.g select.in{min-width:150px}.lk{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--g);text-decoration:underline;cursor:pointer;text-align:left}.bk{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CR=['Qiziqarlilik','Tushunarlilik','Foydalilik','Til va uslub','Tavsiya'];
const NAV={super:[['org','Muassasalar'],['plan','Tariflar']],admin:[['rep','Hisobotlar'],['staff','Xodimlar'],['rev','Sharhlar'],['set','Sozlamalar']],lib:[['lend','Berish'],['ret','Qaytarish'],['cat','Katalog'],['mem',"O'quvchilar"],['fin','Jarimalar'],['res','Band qilish']],stu:[['bot','Telegram bot'],['app','Mini App'],['my','Qarzlarim']]};
const S={role:'lib',tab:'lend',days:14,fine:500,msg:null,sel:null,q:'',pend:null,gap:0,
orgs:[{n:'21-maktab',p:"Boshlang'ich",on:1},{n:'Toshkent kolleji',p:'Standart',on:1},{n:'Ilm-fan litseyi',p:'Standart',on:1}],
staff:['Malika Karimova','Sherzod Nazarov'],
books:[{n:"O'tkan kunlar",a:'A. Qodiriy',g:'Roman',c:3},{n:'Mehrobdan chayon',a:'A. Qodiriy',g:'Roman',c:2},{n:'Alpomish',a:'Xalq dostoni',g:'Doston',c:2},{n:'Fizika 9',a:'Darslik',g:'Darslik',c:5},{n:'Sariq devni minib',a:"X. To'xtaboyev",g:'Bolalar',c:1},{n:'Ikki eshik orasi',a:"O'. Hoshimov",g:'Roman',c:2}],
mem:[{id:482,n:'Dilnoza Aliyeva',ph:'90 111 22 33'},{id:483,n:"Bobur Toshpo'latov",ph:'91 222 33 44'},{id:484,n:'Aziza Rahimova',ph:'93 333 44 55'},{id:485,n:'Jasur Mamatov',ph:'94 444 55 66'}],
loans:[{m:482,b:0,d:9,r:0},{m:483,b:1,d:-5,r:0},{m:484,b:3,d:-3,r:0},{m:485,b:2,d:-1,r:0},{m:485,b:4,d:3,r:0}],
fines:[{m:483,b:5,days:2,amt:1000,paid:0}],
res:[{b:4,m:483}],
rev:[{b:0,w:'Dilnoza A.',s:[5,4,5,5,5],t:'Til boy, voqealar qiziq.'},{b:0,w:'Aziza R.',s:[5,5,4,5,5],t:"Hamma o'qishi kerak."},{b:0,w:'Bobur T.',s:[4,3,4,4,4],t:'Boshlanishi sekin.'},{b:1,w:'Jasur M.',s:[4,4,4,5,4],t:'Yaxshi asar.'},{b:5,w:'Aziza R.',s:[5,5,5,5,5],t:"Juda ta'sirli."},{b:5,w:'Bobur T.',s:[3,4,4,3,3],t:'Unchalik yoqmadi.',hid:1}]};
const mem=id=>S.mem.find(m=>m.id==id),act=b=>S.loans.filter(l=>l.b==b&&!l.r).length,av=b=>S.books[b].c-act(b);
const rate=b=>{const r=S.rev.filter(x=>x.b==b&&!x.hid);if(!r.length)return null;const c=CR.map((_,i)=>r.reduce((s,x)=>s+x.s[i],0)/r.length);return{n:r.length,c,t:c.reduce((s,x)=>s+x,0)/5}};
const rt=b=>{const r=rate(b);return r?`${r.t.toFixed(1)} ★ <span class=mu>(${r.n})</span>`:'<span class=mu>baho yo\'q</span>'};
const mg=()=>S.msg?`<div class="m ${S.msg.ok?'ok':'er'}" role=status>${S.msg.t}</div>`:'';
const say=(ok,t)=>{S.msg={ok,t};draw()};
const setRole=r=>{S.role=r;S.tab=NAV[r][0][0];S.msg=null;S.sel=null;draw()};
const tab=t=>{S.tab=t;S.msg=null;S.sel=null;draw()};
const gp=()=>{S.gap=!S.gap;draw()};
const bkOpts=()=>S.books.map((b,i)=>`<option value=${i}>${esc(b.n)}</option>`).join('');
const mmOpts=()=>S.mem.map(m=>`<option value=${m.id}>${esc(m.n)}</option>`).join('');
const GAP=()=>`<div class=c><b>Hali hal qilinmagan masalalar</b><ul><li>Oflayn rejim: internet uzilsa nima bo'ladi, keyin sinxronlash</li><li>Excel'dan ommaviy import va eski ma'lumotlarni ko'chirish</li><li>Inventarizatsiya (skaner bilan sanash) ekrani</li><li>Muddatni uzaytirish va yo'qolgan/shikastlangan kitob jarayoni</li><li>O'quvchini Telegram botga bog'lash (karta kodi bilan /start)</li><li>Parolni tiklash, harakatlar jurnali ekrani</li><li>To'lov (jarima va obuna) onlayn qabul qilish</li><li>Ko'p filialli muassasalar va tillar (uz/ru/en)</li></ul></div>`;
const M={
org:()=>`<h2>Muassasalar</h2>${mg()}<div class=c><div class=g><input id=on class=in aria-label="Muassasa nomi" placeholder="Muassasa nomi"><select id=op class=in aria-label=Tarif><option>Boshlang'ich<option>Standart<option>Premium</select><button class="b bp" onclick="addOrg()">Qo'shish</button></div></div><div class="c sc"><table>${S.orgs.map((o,i)=>`<tr><td><b>${esc(o.n)}</b><td>${o.p}<td><span class="tg ${o.on?'':'x'}">${o.on?'Faol':"To'xtatilgan"}</span><td><button class=b onclick="togOrg(${i})">${o.on?"To'xtatish":'Faollashtirish'}</button>`).join('')}</table></div>`,
plan:()=>`<h2>Tariflar</h2><div class=st>${[["Boshlang'ich","1 kutubxonachi, asosiy modullar"],["Standart","Telegram bot, hisobotlar, sharhlar"],["Premium","Ko'p filial, API, ustuvor yordam"]].map(t=>`<div class=c><b>${t[0]}</b><div class=mu>${t[1]}</div><div class=mu>Narx: [belgilanadi]</div></div>`).join('')}</div>`,
rep:()=>{const ov=S.loans.filter(l=>!l.r&&l.d<0).length,all=S.books.map((_,i)=>[i,rate(i)]).filter(x=>x[1]).sort((a,b)=>b[1].t-a[1].t).slice(0,3);return`<h2>Hisobotlar</h2><div class=st><div class=c><b>${S.loans.filter(l=>!l.r).length}</b><span>Hozir qo'lda</span></div><div class=c><b style="color:var(--rd)">${ov}</b><span>Qarzdor</span></div><div class=c><b>${S.fines.filter(f=>!f.paid).reduce((s,f)=>s+f.amt,0)}</b><span>To'lanmagan jarima (so'm)</span></div><div class=c><b>${S.mem.length}</b><span>O'quvchi</span></div></div><div class=c><b>Berilgan kitoblar (oylar)</b><div class=g style="align-items:flex-end;height:130px;margin-top:8px;flex-wrap:nowrap">${[['May',55],['Iyun',30],['Iyul',18],['Avg',12],['Sen',80],['Okt',100]].map(x=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px"><div style="width:100%;height:${x[1]}%;background:var(--g);border-radius:5px 5px 0 0"></div>${x[0]}</div>`).join('')}</div></div><div class=c><b>Eng yuqori baholangan</b>${all.map(x=>`<div class=g style="justify-content:space-between;padding:6px 0"><span>${esc(S.books[x[0]].n)}</span><span>${rt(x[0])}</span></div>`).join('')}</div>`},
staff:()=>`<h2>Xodimlar</h2>${mg()}<div class=c><div class=g><input id=sn class=in aria-label="Xodim ismi" placeholder="Kutubxonachi ismi"><button class="b bp" onclick="addStaff()">Qo'shish</button></div></div><div class=c>${S.staff.map((s,i)=>`<div class=g style="justify-content:space-between;padding:6px 0"><span>${esc(s)} <span class=tg>Kutubxonachi</span></span><button class=b onclick="S.staff.splice(${i},1);draw()">Olib tashlash</button></div>`).join('')}</div>`,
rev:()=>`<h2>Sharhlar</h2><div class="c sc"><table>${S.rev.map((r,i)=>`<tr><td><b>${esc(S.books[r.b].n)}</b><br><span class=mu>${r.w}</span><td>${(r.s.reduce((a,b)=>a+b,0)/5).toFixed(1)} ★<td>${esc(r.t)}<td><button class=b onclick="S.rev[${i}].hid=!S.rev[${i}].hid;draw()">${r.hid?"Ko'rsatish":'Yashirish'}</button>`).join('')}</table></div>`,
set:()=>`<h2>Sozlamalar</h2>${mg()}<div class=c><div class=g><label>Berish muddati (kun) <input id=sd class=in type=number value=${S.days} style="width:80px"></label><label>Jarima (so'm/kun) <input id=sf class=in type=number value=${S.fine} style="width:100px"></label><button class="b bp" onclick="S.days=+$('#sd').value;S.fine=+$('#sf').value;say(1,'Sozlamalar saqlandi')">Saqlash</button></div></div>`,
lend:()=>`<h2>Kitob berish</h2>${mg()}<div class=c><div class=g><input id=mc class=in type=number aria-label="Kutubxona kartasi" placeholder="Karta (482-485)" value=482><input id=bc class=in type=number aria-label="Shtrix-kod" placeholder="Shtrix-kod (1-6)" value=4><button class="b bp" onclick="lend()">Berish</button></div><div class=mu style="margin-top:6px">Sinab ko'ring: 483-karta qarzdor, 5-kitob mavjud emas.</div></div>${tbl()}`,
ret:()=>`<h2>Qaytarish</h2>${mg()}<div class="c sc"><table>${S.loans.map((l,i)=>l.r?'':`<tr><td><b>${esc(S.books[l.b].n)}</b><td>${esc(mem(l.m).n)}<td>${l.d<0?`<span class="tg x">${-l.d} kun kechikkan</span>`:`<span class=tg>${l.d} kun qoldi</span>`}<td><button class="b bp" onclick="ret(${i})">Qabul qilish</button>`).join('')}</table></div>`,
cat:()=>{const q=S.q.toLowerCase(),L=S.books.map((b,i)=>[b,i]).filter(x=>(x[0].n+x[0].a+x[0].g).toLowerCase().includes(q));return`<h2>Katalog</h2>${mg()}<div class=c><div class=g><input id=sq class=in aria-label=Qidiruv placeholder="Nom, muallif, janr" value="${esc(S.q)}" oninput="S.q=this.value;draw();$('#sq').focus()"></div></div><div class="c sc"><table><tr><th>Kod<th>Nomi<th>Muallif<th>Janr<th>Mavjud<th>Reyting${L.map(([b,i])=>`<tr><td>${i+1}<td><b>${esc(b.n)}</b><td>${esc(b.a)}<td>${b.g}<td>${av(i)}/${b.c}<td>${rt(i)}`).join('')}</table></div><div class=c><b>Yangi kitob</b><div class=g style="margin-top:8px"><input id=bn class=in placeholder=Nomi aria-label=Nomi><input id=ba class=in placeholder=Muallif aria-label=Muallif><input id=bcnt class=in type=number value=1 style="width:70px" aria-label=Nusxa><button class="b bp" onclick="addBook()">Qo'shish</button></div></div>`},
mem:()=>`<h2>O'quvchilar</h2>${mg()}<div class=c><div class=g><input id=mn class=in placeholder="Ism familiya" aria-label=Ism><input id=mp class=in placeholder=Telefon aria-label=Telefon><button class="b bp" onclick="addMem()">Ro'yxatga olish</button></div></div><div class="c sc"><table>${S.mem.map(m=>`<tr><td>#${m.id}<td><b>${esc(m.n)}</b><td>${esc(m.ph)}<td>${S.loans.filter(l=>l.m==m.id&&!l.r).length} ta kitob`).join('')}</table></div>`,
fin:()=>`<h2>Jarimalar</h2><div class="c sc"><table>${S.fines.map((f,i)=>`<tr><td><b>${esc(mem(f.m).n)}</b><td>${esc(S.books[f.b].n)}<td>${f.days} kun<td>${f.amt} so'm<td><button class="b ${f.paid?'':'bp'}" onclick="S.fines[${i}].paid=!S.fines[${i}].paid;draw()">${f.paid?"To'langan":"To'landi deb belgilash"}</button>`).join('')||'<tr><td>Jarima yo\'q'}</table></div>`,
res:()=>`<h2>Band qilish</h2>${mg()}<div class=c><div class=g><select id=rb class=in aria-label=Kitob>${bkOpts()}</select><select id=rm class=in aria-label=O'quvchi>${mmOpts()}</select><button class="b bp" onclick="reserve($('#rb').value,$('#rm').value)">Navbatga yozish</button></div></div><div class="c sc"><table>${S.res.map((r,i)=>`<tr><td><b>${esc(S.books[r.b].n)}</b><td>${esc(mem(r.m).n)}<td>${av(r.b)>0?'<span class=tg>Mavjud</span>':'<span class="tg x">Kutilmoqda</span>'}<td><button class=b onclick="S.res.splice(${i},1);draw()">Bekor qilish</button>`).join('')||'<tr><td>Navbat bo\'sh'}</table></div>`,
bot:()=>{const p=S.pend;let h=`<div class=bub>Salom, Dilnoza! Men SmartLibrary botiman.</div>`;if(!p)h+=`<div class=bub>Hozircha baholanadigan kitob yo'q. "Kutubxonachi" rolida "Qaytarish" bo'limidan kitob qabul qiling, bot shu yerda baholashni so'raydi.</div>`+(S.last?`<div class=bub>Rahmat! Sharhingiz qo'shildi.</div>`:'');else{h+=`<div class=bub>«${esc(S.books[p.b].n)}» kitobini qaytardingiz. Baholaysizmi?</div>`;p.sc.forEach((s,i)=>h+=`<div class=bub>${CR[i]}?</div><div class="bub me">${s} ★</div>`);h+=`<div class=bub><b>${p.sc.length+1}/5 · ${CR[p.sc.length]}</b></div><div class=g>${[1,2,3,4,5].map(n=>`<button class=b onclick="star(${n})">${n} ★</button>`).join('')}</div>`}return`<h2>Telegram bot</h2><div class=ph><div class=t>SmartLibrary bot</div><div class=bd>${h}</div><div class=bd><button class="b bp" onclick="tab('app')">Katalogni ochish</button></div></div>`},
app:()=>{if(S.sel!=null){const i=S.sel,r=rate(i),b=S.books[i];return`<h2>Mini App</h2>${mg()}<div class=ph><div class=t>${esc(b.n)}</div><div class=bd><div>${esc(b.a)} · ${b.g}</div><div style="font-size:22px;font-weight:800">${rt(i)}</div>${r?CR.map((n,k)=>`<div class=cr><span>${n}</span><div class=bar><i style="width:${r.c[k]*20}%"></i></div><b>${r.c[k].toFixed(1)}</b></div>`).join(''):''}${S.rev.filter(x=>x.b==i&&!x.hid).map(x=>`<div class=bub style="max-width:100%"><b>${x.w}</b> · ${(x.s.reduce((a,b)=>a+b,0)/5).toFixed(1)} ★<br>${esc(x.t)}</div>`).join('')}<button class="b bp" onclick="reserve(${i},482)">Band qilish · ${av(i)} nusxa mavjud</button><button class=b onclick="S.sel=null;S.msg=null;draw()">Orqaga</button></div></div>`}return`<h2>Mini App</h2><div class=ph><div class=t>Katalog</div><div class=bd><input id=sq class=in aria-label=Qidiruv placeholder="Kitob yoki muallif" value="${esc(S.q)}" oninput="S.q=this.value;draw();$('#sq').focus()">${S.books.map((b,i)=>[b,i]).filter(x=>(x[0].n+x[0].a).toLowerCase().includes(S.q.toLowerCase())).map(([b,i])=>`<div class="bub bk" style="max-width:100%" onclick="S.sel=${i};draw()"><b>${esc(b.n)}</b><br><span class=mu>${esc(b.a)}</span><br>${rt(i)} · ${av(i)>0?av(i)+' mavjud':'band'}</div>`).join('')}</div></div>`},
my:()=>{const L=S.loans.filter(l=>l.m==482&&!l.r),F=S.fines.filter(f=>f.m==482&&!f.paid);return`<h2>Qarzlarim</h2><div class=ph><div class=t>Dilnoza Aliyeva · #482</div><div class=bd>${L.map(l=>`<div class=bub style="max-width:100%"><b>${esc(S.books[l.b].n)}</b><br>${l.d<0?`<span style="color:var(--rd)">${-l.d} kun kechikkan</span>`:l.d+' kun qoldi'}</div>`).join('')||'<div class=bub>Qo\'lingizda kitob yo\'q</div>'}${F.map(f=>`<div class=bub style="max-width:100%">Jarima: ${f.amt} so'm</div>`).join('')}${S.res.filter(r=>r.m==482).map(r=>`<div class=bub style="max-width:100%">Band: ${esc(S.books[r.b].n)}</div>`).join('')}</div></div>`}};
const tbl=()=>`<div class="c sc"><b>Hozirgi berilganlar</b><table>${S.loans.filter(l=>!l.r).map(l=>`<tr><td>${esc(S.books[l.b].n)}<td>${esc(mem(l.m).n)}<td>${l.d<0?`<span class="tg x">${-l.d} kun kechikkan</span>`:`<span class=tg>${l.d} kun qoldi</span>`}`).join('')}</table></div>`;
function lend(){const m=mem(+$('#mc').value),i=+$('#bc').value-1,b=S.books[i];if(!m)return say(0,'Bunday kutubxona kartasi topilmadi');if(!b)return say(0,'Bunday shtrix-kod topilmadi');if(S.loans.some(l=>l.m==m.id&&!l.r&&l.d<0))return say(0,`${esc(m.n)} muddati o'tgan kitobni qaytarmagan, berib bo'lmaydi`);if(av(i)<1)return say(0,`«${b.n}» hozir mavjud emas. "Band qilish" bo'limidan navbatga yozing`);S.loans.push({m:m.id,b:i,d:S.days,r:0});say(1,`«${b.n}» ${esc(m.n)} ga berildi. Muddat: ${S.days} kun`)}

M.rep=()=>{const lo=S.loans.filter(l=>!l.r),R={482:31,483:24,484:37,485:19},P=S.books.map((b,i)=>[b.n,5+hs({code:b.n})%40]).sort((a,b)=>b[1]-a[1]).slice(0,5),T=S.mem.map(m=>[m.n,R[m.id]||0]).sort((a,b)=>b[1]-a[1]).slice(0,10),top=S.books.map((_,i)=>[i,rate(i)]).filter(x=>x[1]).sort((a,b)=>b[1].t-a[1].t).slice(0,3);return`<h2>Hisobotlar</h2>${mg()}<div class=g style='margin-bottom:12px'><button class=b onclick=xp()>PDF yuklash</button><button class=b onclick=xp()>Excel yuklash</button></div><div class=st><div class=c><b>${lo.length}</b><span>Hozir qo'lda</span></div><div class=c><b style='color:var(--rd)'>${lo.filter(l=>l.d<0).length}</b><span>Qarzdor</span></div><div class=c><b>${S.fines.filter(f=>!f.paid).reduce((s,f)=>s+f.amt,0)}</b><span>To'lanmagan jarima (so'm)</span></div><div class=c><b>${S.mem.length}</b><span>O'quvchilar</span></div></div><div class=c><b>Oylar bo'yicha berilgan kitoblar</b><div class=g style='align-items:flex-end;height:130px;margin-top:8px;flex-wrap:nowrap'>${[['May',55],['Iyun',30],['Iyul',18],['Avg',12],['Sen',80],['Okt',100]].map(x=>`<div style='flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px'><div style='width:100%;height:${x[1]}%;background:var(--g);border-radius:5px 5px 0 0'></div>${x[0]}</div>`).join('')}</div></div><div class='c bx' style='--cl:#B3402F'><b>Qarzdorlar ro'yxati</b>${lo.filter(l=>l.d<0).map(l=>`<div class=g style='justify-content:space-between;padding:6px 0'><span>${esc(mem(l.m).n)} · ${esc(S.books[l.b].n)}</span><span class='tg x'>${-l.d} kun</span></div>`).join('')||'Yo‘q'}</div><div class='c bx' style='--cl:#3F7CC4'><b>Eng ommabop kitoblar</b>${P.map(([n,v])=>bar(esc(n),v,P[0][1])).join('')}</div><div class='c bx' style='--cl:#D9922B'><b>Eng yaxshi baholanganlar</b>${top.map(x=>`<div class=g style='justify-content:space-between;padding:6px 0'><span>${esc(S.books[x[0]].n)}</span><span>${rt(x[0])}</span></div>`).join('')}</div><div class='c bx' style='--cl:#2E7D6B'><b>O'quvchilar reytingi (eng ko'p o'qiganlar)</b>${T.map(([n,v],k)=>`<div class=g style='justify-content:space-between;padding:6px 0'><span>${k+1}. ${esc(n)}</span><b>${v} ta kitob</b></div>`).join('')}<div class=mu>Ismlar faqat shu muassasa ichida ko'rinadi.</div></div>`};
function xp(){say(1,`Yuklab olish asosiy tizimda ishlaydi, prototipda ko'rsatilmaydi`)}
function addSt(){const n=$('#stn').value.trim(),u=$('#stu').value.trim().toLowerCase();if(!n||!u)return say(0,'Ism va loginni kiriting');if(S.stf.some(a=>a.u==u)||S.sa.some(a=>a.u==u)||S.orgs.some(x=>adm(x).some(a=>a.u==u)))return say(0,`«${esc(u)}» logini band, boshqa login tanlang`);ask(`Kutubxonachi qo'shasizmi?`,`${esc(n)} (${esc(u)}) kutubxonachi bo'ladi. Vaqtinchalik parol yaratiladi.`,()=>{S.stf.push({n,u,last:'—'});S.stp={u,p:pw(),isNew:1};alg(`Xodim qo'shildi: ${u}`);S.msg=null;draw()})}
function rstSt(k){const a=S.stf[k];ask(`Parolni tiklaysizmi?`,`${esc(a.n)} uchun yangi vaqtinchalik parol yaratiladi.`,()=>{S.stp={u:a.u,p:pw(),isNew:0};alg(`Xodim paroli tiklandi: ${a.u}`);S.msg=null;draw()})}
function delSt(k){const a=S.stf[k];ask(`Xodimni o'chirasizmi?`,`${esc(a.n)} tizimga kira olmaydi.`,()=>{S.stf.splice(k,1);alg(`Xodim o'chirildi: ${a.u}`);say(1,'Xodim o‘chirildi')},true)}
M.staff=()=>{const t=S.stp;return`<h2>Xodimlar</h2>${mg()}${t?`<div class='m ok' role=status>${t.isNew?'Xodim qo‘shildi':'Parol tiklandi'}: <b>${esc(t.u)}</b> · vaqtinchalik parol: <b style='font-size:18px'>${t.p}</b><br><span class=mu>Parol faqat shu yerda va bir marta ko'rsatiladi.</span><br><button class=b onclick='S.stp=null;draw()'>Yozib oldim, yopish</button></div>`:''}<div class=c><div class=g><input id=stn class=in placeholder='Ism familiya' aria-label='Ism familiya'><input id=stu class=in placeholder='Login' aria-label='Login'><button class='b bp' onclick=addSt()>Kutubxonachi qo'shish</button></div></div><div class='c sc'><table><tr><th>Xodim<th>Oxirgi kirish<th>${S.stf.map((a,k)=>`<tr><td><b>${esc(a.n)}</b><br><span class=mu>${esc(a.u)}</span><td>${a.last}<td><div class=g><button class=b onclick=rstSt(${k})>Parolni tiklash</button><button class=b onclick=delSt(${k})>O'chirish</button></div>`).join('')}</table></div>`};
function saveSet(){const d=+$('#sd').value,f=+$('#sf').value,c=+$('#sc2').value,m=+$('#sm2').value;if(!(d>0)||!(m>0))return say(0,'Muddat va kitob sonini to‘g‘ri kiriting');ask(`Sozlamalarni saqlaysizmi?`,`Muddat ${d} kun, jarima ${f} so'm/kun, chegara ${c||'yo\'q'}, bir o'quvchiga eng ko'pi ${m} ta kitob.`,()=>{S.days=d;S.fine=f;S.fcap=c;S.maxb=m;alg('Sozlamalar o‘zgartirildi');say(1,'Sozlamalar saqlandi')})}
M.set=()=>`<h2>Sozlamalar</h2>${mg()}<div class=c><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px'><label class=mu>Berish muddati (kun)<input id=sd class=in type=number value=${S.days}></label><label class=mu>Jarima (so'm/kun)<input id=sf class=in type=number value=${S.fine}></label><label class=mu>Jarima chegarasi (so'm, 0 = yo'q)<input id=sc2 class=in type=number value=${S.fcap}></label><label class=mu>Bir o'quvchiga eng ko'p kitob<input id=sm2 class=in type=number value=${S.maxb}></label></div><div class=g style='margin-top:12px'><button class='b bp' onclick=saveSet()>Saqlash</button></div><div class=mu style='margin-top:8px'>Muassasa: ${esc(OM().n)} · ${esc(OM().ph)}. Nomi va telefonini super-admin o'zgartiradi.</div></div>`;
function aqf(el){S.aq=el.value;draw();const i=$('#aq');i.focus();i.setSelectionRange(99,99)}
M.alog=()=>{const q=S.aq.toLowerCase(),F=S.al.filter(e=>!q||(e[1]+e[2]).toLowerCase().includes(q));return`<h2>Jurnal</h2><div class=c><label class=mu>Qidiruv<input id=aq class=in value='${esc(S.aq)}' placeholder='Xodim yoki amal' oninput=aqf(this)></label><div class=mu style='margin-top:8px'>${F.length} ta yozuv, oxirgi 40 tasi ko'rsatilmoqda.</div></div><div class='c sc'><table><tr><th>Sana<th>Kim<th>Amal${F.slice(0,40).map(e=>`<tr><td>${e[0]}<td>${esc(e[1])}<td>${esc(e[2])}`).join('')}</table></div>`};
NAV.admin=[['home','Bosh sahifa'],['fin','Jarimalar'],['rep','Hisobotlar'],['staff','Xodimlar'],['set','Sozlamalar'],['alog','Jurnal'],['sup','Super-admin bilan aloqa']];
NAV.lib=[['lend','Berish'],['ret','Qaytarish'],['cat','Katalog'],['mem',`O'quvchilar`],['fin','Jarimalar'],['res','Band qilish'],['rev','Sharhlar']];
NAV.super.push(['inb','Murojaatlar']);
S.rev.push({b:2,w:'Jasur M.',s:[4,4,5,4,4],t:'Qiziqarli doston.',hid:1,pend:1});
M.fin=()=>{const A=S.role=='admin';return`<h2>Jarimalar</h2>${mg()}<div class='c sc'><table>${S.fines.map((f,i)=>`<tr><td><b>${esc(mem(f.m).n)}</b><td>${esc(S.books[f.b].n)}<td>${f.days} kun<td>${f.amt} so'm<td>${f.paid==1?'<span class=tg>To‘langan</span>':f.paid==2?'<span class=tg>Kechirilgan</span>':`<span class='tg x'>To'lanmagan</span>`}<td>${f.paid?'':A?`<button class=b onclick=fAsk(${i},1)>Kechirish</button>`:`<button class='b bp' onclick=fAsk(${i},0)>To'landi</button>`}`).join('')||`<tr><td>Jarima yo'q`}</table></div><div class=mu>${A?`Admin jarimani kechira oladi, to'lovni kutubxonachi qayd etadi.`:`Kutubxonachi to'lovni qayd etadi, jarimani faqat admin kechira oladi.`}</div>`};
M.rev=()=>`<h2>Sharhlar</h2>${mg()}<div class=mu style='margin-bottom:10px'>Yangi sharh kutubxonachi ruxsat bergandan keyin o'quvchilarga ko'rinadi.</div><div class='c sc'><table>${S.rev.map((r,i)=>`<tr><td><b>${esc(S.books[r.b].n)}</b><br><span class=mu>${r.w}</span><td>${(r.s.reduce((a,b)=>a+b,0)/5).toFixed(1)} ★<td>${esc(r.t)}<td>${r.pend?`<span class=tg style='background:var(--a);color:#1C2421'>Kutilmoqda</span>`:r.hid?`<span class='tg x'>Yashirilgan</span>`:'<span class=tg>Ruxsat berilgan</span>'}<td><div class=g>${r.pend?`<button class='b bp' onclick=revOk(${i})>Ruxsat berish</button>`:''}<button class=b onclick=revT(${i})>${r.pend?'Rad etish':r.hid?`Ko'rsatish`:'Yashirish'}</button></div>`).join('')}</table></div>`;
function revOk(i){const r=S.rev[i];r.pend=0;r.hid=0;alg(`Sharhga ruxsat berildi: ${S.books[r.b].n}`,'Kutubxonachi');draw()}
function revT(i){const r=S.rev[i];r.hid=r.pend?1:!r.hid;r.pend=0;draw()}
{const s0=star;star=n=>{const L=S.rev.length;s0(n);if(S.rev.length>L){const r=S.rev[S.rev.length-1];r.hid=1;r.pend=1;draw()}}}
{const b0=M.bot;M.bot=()=>b0().replace(`Rahmat! Sharhingiz qo'shildi.`,`Rahmat! Sharhingiz kutubxonachi ruxsatidan keyin ko'rinadi.`)}
{const l0=M.lend;M.lend=()=>l0().replace('</h2>',()=>`</h2><div class=mu>Bugun: berildi <b>${S.td.g}</b> · qaytarildi <b>${S.td.r}</b></div>`)}

S.mq=[{id:1,o:'Toshkent kolleji',t:'Muammo (xatolik)',x:`Skaner ruxsat so'rayapti, nima qilish kerak?`,d:D(2),st:'new',re:''},{id:2,o:'Ilm-fan litseyi',t:`Tarif yoki muddat so'rovi`,x:`Muddatni 1 yilga uzaytirmoqchimiz.`,d:D(1),st:'new',re:''},{id:3,o:OM().n,t:'Savol',x:`Xodim parolini qanday tiklayman?`,d:D(6),st:'done',re:`Xodimlar bo'limida «Parolni tiklash» tugmasini bosing.`}];
function sendMsg(){const x=$('#mx').value.trim(),t=$('#mt').value;if(!x)return say(0,'Xabarni yozing');S.mq.unshift({id:Date.now(),o:OM().n,t,x,d:D(0),st:'new',re:''});alg(`Super-adminga murojaat yuborildi: ${t}`);say(1,`Murojaat yuborildi. Javob shu yerda ko'rinadi.`)}
M.sup=()=>{const L=S.mq.filter(m=>m.o==OM().n);return`<h2>Super-admin bilan aloqa</h2>${mg()}<div class=c><div style='display:grid;gap:8px'><label class=mu>Mavzu<select id=mt class=in>${opt(MT)}</select></label><label class=mu>Xabar<textarea id=mx class=in rows=4 style='padding:10px;min-height:90px'></textarea></label><div><button class='b bp' onclick=sendMsg()>Yuborish</button></div></div></div><div class=c><b>Murojaatlaringiz</b>${L.map(m=>`<div style='padding:10px 0;border-top:1px solid var(--ln)'><div class=g style='justify-content:space-between'><b>${m.t}</b>${m.st=='done'?`<span class=tg>Javob berilgan</span>`:`<span class='tg x'>Javob kutilmoqda</span>`}</div><div class=mu>${m.d}</div><div>${esc(m.x)}</div>${m.re?`<div class='m ok' style='margin:8px 0 0'>Super-admin: ${esc(m.re)}</div>`:''}</div>`).join('')||`<div class=mu>Hali murojaat yo'q</div>`}</div>`};
function goOrgI(i){S.tab='org';openOrg(i)}
function repl(id){const m=S.mq.find(x=>x.id==id),v=$('#rp'+id).value.trim();if(!v)return say(0,'Javob yozing');ask('Javob yuborasizmi?',`«${esc(m.o)}» adminiga javob yuboriladi.`,()=>{m.re=v;m.st='done';lg(`Murojaatga javob berildi: ${m.o}`);say(1,'Javob yuborildi')})}
M.inb=()=>{const L=[...S.mq].sort((a,b)=>(a.st=='new'?0:1)-(b.st=='new'?0:1));return`<h2>Murojaatlar</h2>${mg()}<div class=st><div class=c><b style='color:var(--rd)'>${S.mq.filter(m=>m.st=='new').length}</b><span>Javob kutayotgan</span></div><div class=c><b>${S.mq.filter(m=>m.st=='done').length}</b><span>Javob berilgan</span></div></div>${L.map(m=>{const i=S.orgs.findIndex(o=>o.n==m.o);return`<div class='c bx' style='--cl:${m.st=='new'?'#B3402F':'#2E7D6B'}'><div class=g style='justify-content:space-between'><b>${esc(m.o)}</b><span class=mu>${m.t} · ${m.d}</span></div><div style='margin:8px 0'>${esc(m.x)}</div>${m.st=='new'?`<textarea id=rp${m.id} class=in rows=3 style='padding:10px;width:100%;box-sizing:border-box' aria-label='Javob'></textarea><div class=g style='margin-top:8px'><button class='b bp' onclick=repl(${m.id})>Javob berish</button>${i>=0?`<button class=b onclick=goOrgI(${i})>Muassasani ochish</button>`:''}</div>`:`<div class='m ok' style='margin:0'>Javob: ${esc(m.re)}</div>`}</div>`}).join('')}`};
NAV.lib.push(['llog','Jurnal']);
S.lq='';S.sm=null;
function lqf(el){S.lq=el.value;draw();const i=$('#lq');i.focus();i.setSelectionRange(99,99)}
M.llog=()=>{const q=S.lq.toLowerCase(),F=S.al.filter(e=>e[1]!='Admin'&&(!q||(e[1]+e[2]).toLowerCase().includes(q)));return`<h2>Jurnal</h2><div class=mu style='margin-bottom:10px'>Kutubxona xodimlarining harakatlari.</div><div class=c><label class=mu>Qidiruv<input id=lq class=in value='${esc(S.lq)}' placeholder='Xodim yoki amal' oninput=lqf(this)></label><div class=mu style='margin-top:8px'>${F.length} ta yozuv, oxirgi 40 tasi ko'rsatilmoqda.</div></div><div class='c sc'><table><tr><th>Sana<th>Kim<th>Amal${F.slice(0,40).map(e=>`<tr><td>${e[0]}<td>${esc(e[1])}<td>${esc(e[2])}`).join('')}</table></div>`};
function fAsk(i,w){const f=S.fines[i];ask(w?`Jarimani kechirasizmi?`:`To'lovni tasdiqlaysizmi?`,`${esc(mem(f.m).n)}: ${f.amt} so'm ${w?'kechiriladi (bekor qilinadi)':`to'langan deb belgilanadi`}.`,()=>{f.paid=w?2:1;alg(`${w?'Jarima kechirildi':`Jarima to'landi`}: ${mem(f.m).n} (${f.amt} so'm)`,w?'Admin':'Kutubxonachi');say(1,w?'Jarima kechirildi':`To'lov tasdiqlandi`)})}
{const a1=addMem;addMem=()=>{const n=S.mem.length;a1();if(S.mem.length>n)alg(`O'quvchi ro'yxatga olindi: ${S.mem[S.mem.length-1].n}`,'Kutubxonachi')}}
{const a2=addBook;addBook=()=>{const n=S.books.length;a2();if(S.books.length>n)alg(`Kitob qo'shildi: ${S.books[S.books.length-1].n}`,'Kutubxonachi')}}
function stOpen(id){S.sm=id;draw()}
function stClose(){S.sm=null;draw()}
const ball=m=>S.fines.filter(f=>f.m==m&&f.paid!=2).reduce((t,f)=>t+(f.days>=8?3:f.days>=4?2:1),0);
const past=m=>[0,1,2,3].map(k=>({b:(m*7+k*2)%S.books.length,d:D(20+k*17+m%9)}));
const stH=()=>{const m=mem(S.sm),A=S.loans.filter(l=>l.m==m.id&&!l.r),R=S.loans.filter(l=>l.m==m.id&&l.r),P=past(m.id),bl=ball(m.id),F=S.fines.filter(f=>f.m==m.id);const ln=(a,b)=>`<div class=g style='justify-content:space-between;padding:5px 0'><span>${a}</span><span class=mu>${b}</span></div>`;return`<div class=ov role=dialog aria-modal=true aria-label='O‘quvchi'><div class=md style='max-width:460px;max-height:90vh;overflow:auto'><div class=g style='justify-content:space-between'><b style='font-size:18px'>${esc(m.n)}</b><button class=b onclick=stClose()>Yopish</button></div><div class=g style='gap:20px;margin:10px 0'>${det('Karta','#'+m.id)}${det('Telefon',esc(m.ph))}${det('Jami o‘qigan',P.length+R.length)}</div><b>Hozir qo'lida</b>${A.map(l=>ln(esc(S.books[l.b].n),l.d<0?`<span class='tg x'>${-l.d} kun kechikkan</span>`:l.d+' kun qoldi')).join('')||`<div class=mu>Yo'q</div>`}<div style='margin-top:10px'><b>Qaytarilgan kitoblar</b></div>${R.map(l=>ln(esc(S.books[l.b].n),D(0))).join('')}${P.map(p=>ln(esc(S.books[p.b].n),p.d)).join('')}<div style='margin-top:10px'><b>Jarima bali</b> ${bl?`<span class='tg x'>${bl} ball</span>`:''}</div>${F.map(f=>ln(`${esc(S.books[f.b].n)}: ${f.days} kun kechikish`,f.paid==2?'kechirilgan':`${f.days>=8?3:f.days>=4?2:1} ball`)).join('')||`<div class=mu>Jarima bali yo'q</div>`}${F.length?`<div class=mu style='margin-top:6px'>Ball taxminiy qoida bilan hisoblangan: 1-3 kun 1 ball, 4-7 kun 2 ball, 8 va undan ko'p kun 3 ball.</div>`:''}</div></div>`};
{const m0=M.mem;M.mem=()=>m0().replace(/<tr><td>#(\d+)<td><b>([^<]*)<\/b>/g,(x,id,n)=>`<tr><td>#${id}<td><button class=lk onclick=stOpen(${id})>${n}</button>`)+(S.sm!=null&&mem(S.sm)?stH():'')}
draw();
